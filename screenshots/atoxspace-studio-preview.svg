    <text x="10" y="80" fill="#38bdf8" font-size="9" font-family="JetBrains Mono, monospace">MAT-02: 1.137 µm</text><rect x="110" y="68" width="74" height="14" rx="3" fill="#34d399" />
    <text x="10" y="110" fill="#38bdf8" font-size="9" font-family="JetBrains Mono, monospace">MAT-03: 0.245 µm</text><rect x="110" y="98" width="16" height="14" rx="3" fill="#34d399" />
    <text x="10" y="140" fill="#38bdf8" font-size="9" font-family="JetBrains Mono, monospace">MAT-04: 0.000 µm</text><rect x="110" y="128" width="2" height="14" rx="3" fill="#34d399" />
    <text x="10" y="170" fill="#38bdf8" font-size="9" font-family="JetBrains Mono, monospace">MAT-05: 0.000 µm</text><rect x="110" y="158" width="2" height="14" rx="3" fill="#34d399" />

