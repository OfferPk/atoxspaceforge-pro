    <text x="484" y="66" fill="#cbd5e1" font-size="10" font-family="JetBrains Mono, monospace">atoms/cm² (3.0 yr Life)</text>

    <rect x="702" y="0" width="218" height="75" rx="8" fill="#0f172a" stroke="#1e293b" />
    <text x="718" y="24" fill="#94a3b8" font-size="11" font-family="JetBrains Mono, monospace">THERMAL DELTA ALPHA</text>
    <text x="718" y="50" fill="#34d399" font-size="20" font-family="JetBrains Mono, monospace" font-weight="bold">+0.0120</text>
    <text x="718" y="66" fill="#cbd5e1" font-size="10" font-family="JetBrains Mono, monospace">Limit: &lt;= 0.0500</text>

