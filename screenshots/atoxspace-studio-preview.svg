<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="680" fill="url(#bgDark)" />
  <rect x="0" y="0" width="1200" height="60" fill="rgba(2, 6, 23, 0.95)" stroke="#1e293b" />
