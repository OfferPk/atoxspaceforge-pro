    <text x="10" y="60" fill="#38bdf8">MAT-03</text><text x="80" y="60" fill="#e2e8f0">Carbon Fiber Truss M55J/Cyanate</text><text x="310" y="60" fill="#cbd5e1">1200.0</text><text x="410" y="60" fill="#cbd5e1">0.245</text><text x="500" y="60" fill="#34d399">+99.98%</text><text x="620" y="60" fill="#34d399">COMPLIANT</text>
    <text x="10" y="82" fill="#38bdf8">MAT-04</text><text x="80" y="82" fill="#e2e8f0">Solar Array Coverglass (Ceria)</text><text x="310" y="82" fill="#cbd5e1">100.0</text><text x="410" y="82" fill="#cbd5e1">0.000</text><text x="500" y="82" fill="#34d399">+100.00%</text><text x="620" y="82" fill="#34d399">COMPLIANT</text>
    <text x="10" y="104" fill="#38bdf8">MAT-05</text><text x="80" y="104" fill="#e2e8f0">Solar Cell Silver Ribbon (Potted)</text><text x="310" y="104" fill="#cbd5e1">35.0</text><text x="410" y="104" fill="#cbd5e1">0.000</text><text x="500" y="104" fill="#34d399">+100.00%</text><text x="620" y="104" fill="#34d399">COMPLIANT</text>
