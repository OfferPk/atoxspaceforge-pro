    <text x="16" y="24" fill="#94a3b8" font-size="11" font-family="JetBrains Mono, monospace">MIN THICKNESS MARGIN</text>
    <text x="16" y="50" fill="#34d399" font-size="20" font-family="JetBrains Mono, monospace" font-weight="bold">+95.99%</text>
    <text x="16" y="66" fill="#38bdf8" font-size="10" font-family="JetBrains Mono, monospace">Req: &gt;= +33.33% (SF 1.5)</text>

    <rect x="234" y="0" width="218" height="75" rx="8" fill="#0f172a" stroke="#1e293b" />
