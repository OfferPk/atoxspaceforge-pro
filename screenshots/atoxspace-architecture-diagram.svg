<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)" />
  <rect x="20" y="20" width="760" height="410" rx="12" fill="rgba(15, 23, 42, 0.75)" stroke="#1e293b" stroke-width="1.5" />
  <text x="40" y="55" fill="#ffffff" font-size="18" font-family="Inter, sans-serif" font-weight="bold">ATOXSpaceForge Pro v1.0.0 - Spacecraft ATOX Architecture</text>
  <text x="40" y="78" fill="#94a3b8" font-size="12" font-family="JetBrains Mono, monospace">ECSS-E-ST-10-04C Cl. 9, ASTM E2089-15 &amp; NASA-STD-6016 Mission Verification</text>

  <!-- Block 1: Thermosphere -->
  <rect x="50" y="110" width="210" height="280" rx="8" fill="#111c35" stroke="#06b6d4" stroke-width="1.5" />
  <text x="70" y="140" fill="#38bdf8" font-size="13" font-family="Inter, sans-serif" font-weight="bold">1. Thermosphere &amp; Orbit</text>
  <text x="70" y="170" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Altitude: 180 - 650 km</text>
  <text x="70" y="195" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Solar Activity F10.7 sfu</text>
  <text x="70" y="220" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">n_O(h, F10.7) Density</text>
  <text x="70" y="245" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">v_orb = (mu/r)^0.5</text>
  <text x="70" y="270" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Flux = n_O * v * cos(th)</text>
  <text x="70" y="295" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Fluence F_AO (atoms/cm2)</text>
  <rect x="70" y="330" width="170" height="36" rx="6" fill="#0284c7" opacity="0.2" stroke="#38bdf8" />
  <text x="85" y="353" fill="#7dd3fc" font-size="10" font-family="JetBrains Mono, monospace">NRLMSISE-00 CALIBRATED</text>

  <line x1="260" y1="250" x2="295" y2="250" stroke="#06b6d4" stroke-width="2" />

  <!-- Block 2: Material Degradation Engine -->
  <rect x="295" y="110" width="210" height="280" rx="8" fill="#111c35" stroke="#3b82f6" stroke-width="1.5" />
  <text x="315" y="140" fill="#60a5fa" font-size="13" font-family="Inter, sans-serif" font-weight="bold">2. Material Erosion Engine</text>
  <text x="315" y="170" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Kapton HN (ASTM E2089)</text>
  <text x="315" y="195" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Carbon Fiber Composite</text>
  <text x="315" y="220" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Silver Solar Interconnect</text>
  <text x="315" y="245" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Sputtered SiO2 / ALD</text>
  <text x="315" y="270" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Pinhole Defect Factor</text>
  <text x="315" y="295" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Recession dx = F_AO * Ey</text>
  <rect x="315" y="330" width="170" height="36" rx="6" fill="#2563eb" opacity="0.2" stroke="#60a5fa" />
  <text x="330" y="353" fill="#93c5fd" font-size="10" font-family="JetBrains Mono, monospace">SF &gt;= 1.50 (MAR &gt;= 33.3%)</text>

  <line x1="505" y1="250" x2="540" y2="250" stroke="#3b82f6" stroke-width="2" />

  <!-- Block 3: Verification & Auditor -->
  <rect x="540" y="110" width="210" height="280" rx="8" fill="#111c35" stroke="#10b981" stroke-width="1.5" />
  <text x="560" y="140" fill="#34d399" font-size="13" font-family="Inter, sans-serif" font-weight="bold">3. Normative Auditor</text>
  <text x="560" y="170" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">10-Point ECSS Matrix</text>
  <text x="560" y="195" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Real-Time Pass/Fail</text>
  <text x="560" y="220" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Thermal Delta Alpha</text>
  <text x="560" y="245" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Silver Flaking Interlock</text>
  <text x="560" y="270" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">Areal Mass Loss mg/cm2</text>
  <text x="560" y="295" fill="#cbd5e1" font-size="11" font-family="JetBrains Mono, monospace">NASA / ECSS XML Export</text>
  <rect x="560" y="330" width="170" height="36" rx="6" fill="#059669" opacity="0.2" stroke="#34d399" />
  <text x="578" y="353" fill="#6ee7b7" font-size="10" font-family="JetBrains Mono, monospace">10 / 10 RULES PASS (100%)</text>
</svg>